name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires ^20.19.0 || >=22.12.0 (Node 18 is unsupported)
        node-version: ['20.19', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing-page dependencies
        run: npm ci
        working-directory: landing-page

      - name: Typecheck
        run: npm run typecheck

      - name: Lint landing page
        run: npm run lint --prefix landing-page

      - name: Build landing and docs bundle
        run: npm run build

      - name: Static project checks
        run: npm run ci:static

  smoke:
    name: HTTP smoke
    runs-on: ubuntu-latest
    needs: static
    env:
      API_SECRET: ci-test-secret
      NODE_ENV: production
      PORT: 3456

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing-page dependencies
        run: npm ci
        working-directory: landing-page

      - name: Build landing and docs bundle
        run: npm run build

      - name: Start server
        run: |
          npm start &
          echo $! > /tmp/substack-agent.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3456/api/config > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          exit 1

      - name: Auth tests
        run: npm run test:auth

      - name: Smoke tests
        run: npm run test:smoke

      - name: API smoke (skips credential-gated cases)
        run: npm run test:api

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/substack-agent.pid ]; then
            kill "$(cat /tmp/substack-agent.pid)" || true
          fi
