name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: lint-build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires ^20.19.0 || >=22.12.0
        node-version: ['20.19', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install dependencies (root + landing-page via postinstall)
        run: npm ci

      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint/oxlint (landing-page)
        run: npm run lint --prefix landing-page

      - name: Vite production build → public/
        run: npm run build

      - name: Validate OpenAPI, docs nav, and public assets
        run: npm run ci:static

  api-smoke:
    name: api-smoke (Node 22)
    runs-on: ubuntu-latest
    needs: lint-build
    env:
      API_SECRET: ci-test-secret
      NODE_ENV: production
      PORT: 3456

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install dependencies (root + landing-page via postinstall)
        run: npm ci

      - name: Vite production build → public/
        run: npm run build

      - name: Start Express server
        run: |
          npm start &
          echo $! > /tmp/substack-agent.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3456/api/config > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          exit 1

      - name: Test Bearer auth (/api/tools, /api/mcp)
        run: npm run test:auth

      - name: Test HTTP smoke (routes, OpenAPI, secret leakage)
        run: npm run test:smoke

      - name: Test Tools API smoke (credential-gated cases skipped)
        run: npm run test:api

      - name: Stop Express server
        if: always()
        run: |
          if [ -f /tmp/substack-agent.pid ]; then
            kill "$(cat /tmp/substack-agent.pid)" || true
          fi
